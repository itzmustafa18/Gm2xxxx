name: ohlcv

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ohlcv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          

      - name: Install deps
        run: |
          pip install pandas websocket-client requests
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Fetch OHLCV
        env:
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          
        run: python fetch_ohlcv.py
      - name: Commit data
        run: |
          git config user.name "ohlcv-bot"
          git config user.email "ohlcv-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          cp -r data /tmp/data_new
          ok=0
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/data_new/. data/
            git add data
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -m "data update"
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || exit 1
    
